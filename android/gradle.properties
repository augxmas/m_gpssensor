# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AGP 8.x requires a JDK 17-21. The system default here is JDK 23, which AGP
# does not support, so we pin Gradle to the JDK 21 bundled with Android Studio.
# If Android Studio is installed elsewhere, update this path (or delete the line
# to use a JAVA_HOME pointing at JDK 17/21).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# AndroidX
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
