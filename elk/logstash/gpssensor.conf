# Logstash pipeline for GPS Sensor Logger logs.
#
# Drop the app's *.json log files into C:/elk/ingest/ and Logstash will read each
# one, explode its "samples" array into one document per sample, build a geo_point
# from lat/lon, and index into Elasticsearch.
#
# Run:  bin\logstash.bat -f C:\proj\m_gpssensor\elk\logstash\gpssensor.conf
#
# NOTE: install the index template first so "location" is mapped as geo_point:
#   node C:\proj\m_gpssensor\elk\ingest.mjs --setup-only   (or PUT index-template.json)
# Otherwise ES will auto-map location as an object and Maps won't see it.

input {
  file {
    path => "C:/elk/ingest/*.json"
    mode => "read"
    codec => "json"
    sincedb_path => "NUL"
    file_completed_action => "log"
    file_completed_log_path => "C:/elk/ingest/processed.log"
  }
}

filter {
  # one event per sample
  split { field => "samples" }

  ruby {
    code => '
      s = event.get("samples") || {}
      started = event.get("[session][startedAt]").to_i
      t = s["t"].to_i
      event.set("@timestamp", Time.at((started + t) / 1000.0))
      event.set("t_ms", t)
      event.set("alt", s["alt"])
      event.set("gps_accuracy", s["acc"])
      ["ax","ay","az","gx","gy","gz","mx","my","mz"].each { |k| event.set(k, s[k]) }
      if !s["lat"].nil? && !s["lon"].nil?
        event.set("location", { "lat" => s["lat"], "lon" => s["lon"] })
      end
      event.set("session_id", event.get("[session][id]"))
      event.set("device", event.get("[session][device]"))
      event.set("interval_ms", event.get("[session][intervalMs]"))
    '
  }

  mutate {
    remove_field => ["samples", "session", "format", "version", "event", "host", "log", "@version", "message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "gpssensor-logs"
  }
  # uncomment to debug in the console:
  # stdout { codec => rubydebug }
}
